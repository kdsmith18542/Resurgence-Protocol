type ResurgeToken @entity {
  id: ID!
  name: String!
  symbol: String!
  totalSupply: BigInt!
  totalStakedAllPools: BigInt!
  totalRewardsDistributed: BigInt!
}

type User @entity {
  id: Bytes!
  stakedBalance: BigInt!
  totalResurgeEarned: BigInt!
  rewardsClaimed: BigInt!
  totalStakingTransactions: BigInt!
  stakingPositions: [StakingPosition!] @derivedFrom(field: "user")
  stakingEvents: [StakingEvent!] @derivedFrom(field: "user")
  rewardClaimEvents: [RewardClaimEvent!] @derivedFrom(field: "user")
  votes: [VoteReceipt!] @derivedFrom(field: "voter")
  bridgeClaimEvents: [BridgeClaimEvent!] @derivedFrom(field: "user")
  nonEvmWallets: [NonEvmWallet!] @derivedFrom(field: "staker")
  legacyClaims: [LegacyClaim!] @derivedFrom(field: "evmWallet")
}

type NonEvmWallet @entity {
  id: Bytes!
  chainId: Bytes!
  walletHash: Bytes!
  wallet: String!
  staker: User!
  registeredAt: BigInt!
  active: Boolean!
  registeredAtBlock: BigInt!
  registeredAtTx: Bytes!
}

type StakingPool @entity {
  id: Bytes!
  deadCoinToken: Bytes!
  poolAddress: Bytes!
  resurgeToken: Bytes!
  rewardRatePerSecond: BigInt!
  lastUpdateTime: BigInt!
  rewardPerTokenStored: BigInt!
  totalStaked: BigInt!
  paused: Boolean!
  createdAt: BigInt!
  stakerCount: BigInt!
  stakingPositions: [StakingPosition!] @derivedFrom(field: "pool")
  stakingEvents: [StakingEvent!] @derivedFrom(field: "pool")
  bridgeClaimEvents: [BridgeClaimEvent!] @derivedFrom(field: "pool")
}

type StakingPosition @entity {
  id: Bytes!
  user: User!
  pool: StakingPool!
  stakedAmount: BigInt!
  unclaimedRewards: BigInt!
  rewardPerTokenPaid: BigInt!
  lastStakedAt: BigInt!
  lastUnstakedAt: BigInt
  lastClaimedAt: BigInt
}

enum EventType {
  Stake
  Unstake
  Claim
}

type StakingEvent @entity(immutable: true) {
  id: Bytes!
  user: User!
  pool: StakingPool!
  amount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
  type: EventType!
}

type RewardClaimEvent @entity(immutable: true) {
  id: Bytes!
  user: User!
  pool: StakingPool!
  amount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type BridgeClaimEvent @entity(immutable: true) {
  id: Bytes!
  user: User!
  pool: StakingPool!
  amount: BigInt!
  messageId: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type GovernanceProposal @entity {
  id: Bytes!
  proposalId: BigInt!
  proposer: Bytes!
  targets: [Bytes!]!
  values: [BigInt!]!
  signatures: [String!]!
  calldatas: [Bytes!]!
  description: String!
  startBlock: BigInt!
  endBlock: BigInt!
  forVotes: BigInt!
  againstVotes: BigInt!
  abstainVotes: BigInt!
  executed: Boolean!
  canceled: Boolean!
  queued: Boolean!
  eta: BigInt
  createdAt: BigInt!
  executedAt: BigInt
  receipts: [VoteReceipt!] @derivedFrom(field: "proposal")
}

type VoteReceipt @entity(immutable: true) {
  id: Bytes!
  proposal: GovernanceProposal!
  voter: User!
  support: Int!
  votes: BigInt!
  reason: String
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type ProtocolMetrics @entity {
  id: ID!
  totalValueLocked: BigInt!
  totalPools: BigInt!
  totalStakers: BigInt!
  totalProposals: BigInt!
  updatedAt: BigInt!
}

type LegacyClaim @entity {
  id: Bytes! # the claimId
  sourceChainId: Bytes!
  sourceAddressHash: Bytes!
  evmWallet: User!
  proofHash: Bytes!
  sourceTxHash: Bytes!
  claimType: Int!
  confidenceTier: Int!
  lastSeenTimestamp: BigInt!
  dormancySeconds: BigInt!
  rewardAmount: BigInt!
  campaignId: BigInt!
  status: String! # "Pending", "Verified", "Minted", "Rejected", "Quarantined", "Expired"
  quarantineReason: String
  submittedAt: BigInt!
  submittedAtBlock: BigInt!
  submittedAtTx: Bytes!
  quarantineEvents: [LaceQuarantineEvent!]! @derivedFrom(field: "claim")
}

type LaceQuarantineEvent @entity {
  id: Bytes! # txHash + claimId
  claim: LegacyClaim!
  eventType: String! # "Quarantined", "Released", "Rejected"
  reason: String
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type LaceCampaign @entity {
  id: ID! # campaignId
  active: Boolean!
  startTime: BigInt!
  endTime: BigInt!
  maxTotalRewards: BigInt!
  rewardsMinted: BigInt!
  updatedAt: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTx: Bytes!
}

type LacePolicy @entity {
  id: Bytes! # sourceChainId (or 0x0000... for default policy)
  enabled: Boolean!
  transferToVaultEnabled: Boolean!
  burnProofEnabled: Boolean!
  lockProofEnabled: Boolean!
  signatureProofEnabled: Boolean!
  rpcEvidenceEnabled: Boolean!
  explorerEvidenceEnabled: Boolean!
  zkProofEnabled: Boolean!
  minDormancySeconds: BigInt!
  minHistoricalBalance: BigInt!
  maxRewardPerClaim: BigInt!
  maxRewardPerEpoch: BigInt!
  minConfidenceTier: Int!
  updatedAt: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTx: Bytes!
}

type LaceVault @entity {
  id: Bytes! # sourceChainId
  vaultAddress: String!
  updatedAt: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTx: Bytes!
}

type LaceBurnAddress @entity {
  id: Bytes! # sourceChainId
  burnAddress: String!
  updatedAt: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTx: Bytes!
}

type TransferClaim @entity {
  id: Bytes! # claimId
  legacyClaim: LegacyClaim!
  claimType: String!
  sourceChainId: Bytes!
  evmWallet: User!
  rewardAmount: BigInt!
  status: String!
  submittedAt: BigInt!
  submittedAtBlock: BigInt!
  submittedAtTx: Bytes!
  sourceTxHash: Bytes
}

type ConfidenceMultiplier @entity {
  id: ID! # claimType as string
  claimType: String!
  multiplier: Int! # basis points (100 = 1.00x)
  updatedAt: BigInt!
}
